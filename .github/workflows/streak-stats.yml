name: Update streak card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streak-stats.yml"

concurrency:
  group: profile-streak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@adbd07609bb771d3510a15ee2f3b31d5fbe5201d # v1
        with:
          options: user=Siser-Pratap&theme=catppuccin-mocha&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("profile/streak.svg")
          root = ET.parse(path).getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          text = " ".join(root.itertext()).lower()
          assert "current streak" in text and "longest streak" in text
          assert "something went wrong" not in text
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update generated streak card"
          git pull --rebase origin main
          git push origin HEAD:main
